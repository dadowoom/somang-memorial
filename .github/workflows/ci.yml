name: Verify application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kiosk:
    name: Chrome kiosk launcher (Windows PowerShell)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify setup and launcher without changing Windows settings
        shell: powershell
        run: ./scripts/kiosk/setup-kiosk.test.ps1

  verify:
    name: Type, test, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 저장소의 .nvmrc(24) 를 따른다. 문서·로컬과 CI 의 Node 버전을 하나로 둔다.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Run tests
        run: pnpm test -- --run

      - name: Check fixed service maintenance tools
        run: |
          bash -n scripts/ops-pm2-restart.sh
          sudo -n python3 -I -B scripts/ops-runtime-permissions.test.py
          sudo -n python3 -I -B scripts/ops-release-archive.test.py

      - name: Build production files
        run: pnpm run build

      - name: Check high and critical dependency vulnerabilities
        run: pnpm audit --prod --audit-level=high
